[project]
name = "pokemon-emerald"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arcade>=3.3.3",
    "pydantic>=2.12.5",
    "pyglet>=2.1.15",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "bandit>=1.9.4",
    "vulture>=2.16",
    "py-spy>=0.4.2",
    "scalene>=2.3.0",
    "pydeps>=3.0.6",
    "snakeviz>=2.2.2",
    "pre-commit>=4.6.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.bandit]
skips = ["B311"]
