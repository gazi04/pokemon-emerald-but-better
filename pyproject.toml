[project]
name = "pokemon-emerald"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arcade>=3.3.3",
    "pydantic>=2.12.5",
    "pyglet>=2.1.14",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.bandit]
skips = ["B311"]
